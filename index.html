<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenJS CAD</title>
    <meta
      name="description"
      content="OpenJS CAD project rendered as a GitHub Pages site."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub Pages</p>
          <h1>OpenJS CAD</h1>
        </div>
        <a class="button" href="openjscad-project%20(2).json" target="_blank" rel="noreferrer">
          Open JSON
        </a>
      </header>

      <main class="viewer-wrap">
        <div class="card">
          <div class="card-header">
            <h2>Design Preview</h2>
            <span id="status">Loading drawing…</span>
          </div>
          <svg
            id="drawing"
            viewBox="-70 -20 180 100"
            preserveAspectRatio="xMidYMid meet"
            aria-label="OpenJS CAD drawing preview"
            role="img"
          ></svg>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
